services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  gateway:
    build: .
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    # TLS termination (reverse proxy) is out of scope here; publish on loopback or an internal IP.
    ports: ["${GATEWAY_BIND:-127.0.0.1:80}:8000"]

volumes:
  redis-data:
