name: build-binance-image
on:
  push:
    branches: [main]
    paths: ["binance/**", "agent/link.py", "Dockerfile.binance", "pyproject.toml", "uv.lock", ".github/workflows/build-binance-image.yml"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.binance
          push: true
          tags: |
            ghcr.io/hoangccll/mt5-trade-tmp/binance-agent:latest
            ghcr.io/hoangccll/mt5-trade-tmp/binance-agent:${{ github.sha }}
