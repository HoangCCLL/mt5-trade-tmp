<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MT5 Gateway</title>
<style>
  :root { --bg:#f6f7f9; --fg:#1b1f24; --muted:#6b7280; --card:#fff; --line:#e5e7eb; --ok:#16a34a; --bad:#dc2626; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1216; --fg:#e6e8eb; --muted:#9aa3ad; --card:#171b21; --line:#2a313a; } }
  :root[data-theme="dark"] { --bg:#0f1216; --fg:#e6e8eb; --muted:#9aa3ad; --card:#171b21; --line:#2a313a; }
  * { box-sizing:border-box } body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui,sans-serif; padding:16px }
  header { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px }
  h1 { font-size:18px; margin:0 12px 0 0 } h2 { font-size:14px; margin:0 0 8px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em }
  input, select, button { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg) }
  button { cursor:pointer } button.primary { background:var(--accent); color:#fff; border-color:var(--accent) } button.danger { color:var(--bad) }
  .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; min-width:0 }
  table { width:100%; border-collapse:collapse } th, td { text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); white-space:nowrap } th { color:var(--muted); font-weight:500 }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 12px } .kv b { font-weight:500; color:var(--muted) }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line) }
  .on { color:var(--ok); border-color:var(--ok) } .off { color:var(--bad); border-color:var(--bad) }
  .pos { color:var(--ok) } .neg { color:var(--bad) }
  #log { font:12px/1.4 ui-monospace,monospace; max-height:260px; overflow:auto; white-space:pre-wrap; margin:0 }
  form.row { display:flex; flex-wrap:wrap; gap:6px } form.row input { width:110px } form.row input.wide { width:160px }
  .scroll { overflow-x:auto }
</style>
</head>
<body>
<header>
  <h1>MT5 Gateway</h1>
  <input id="key" placeholder="API key" type="password" size="28" title="GATEWAY_API_KEY của BE. Lưu trong trình duyệt này, không gửi đi đâu khác.">
  <select id="acct" title="Account = một VPS = một terminal MT5. ● đang alive, ○ mất heartbeat > 15 s."></select>
  <button id="refresh" title="Tải lại danh sách account và trạng thái (tự chạy mỗi 15 s)">Refresh</button>
  <span id="status" title="trader: worker đặt lệnh đã nối. streamer: worker đẩy state/tick đã nối. alive: có heartbeat trong 15 s qua."></span>
</header>
<div class="grid">
  <section class="card"><h2 title="Snapshot tài khoản từ streamer, cập nhật khi có thay đổi hoặc mỗi 30 s">Account</h2><div id="account" class="kv"></div></section>
  <section class="card"><h2>New order</h2>
    <form id="order" class="row">
      <select name="symbol" required title="Symbol trong Market Watch của terminal (lấy từ terminal khi chọn account)"><option value="">symbol…</option></select>
      <select name="side" title="buy = mua tại ask, sell = bán tại bid"><option>buy</option><option>sell</option></select>
      <input name="volume" type="number" step="0.01" min="0.01" value="0.01" required title="Khối lượng (lot). 0.01 = micro lot">
      <input name="sl" type="number" step="any" placeholder="sl" title="Stop loss (giá). Để trống = không đặt">
      <input name="tp" type="number" step="any" placeholder="tp" title="Take profit (giá). Để trống = không đặt">
      <input name="magic" type="number" list="magics" value="1" required title="Magic number: nhãn số để nhận ra lệnh của hệ thống/chiến lược nào. Gợi ý từ các position đang mở">
      <datalist id="magics"></datalist>
      <input name="comment" class="wide" placeholder="comment" maxlength="31" title="Ghi chú ≤ 31 ký tự, broker có thể ghi đè">
      <button class="primary" title="Gửi lệnh market. Kết quả về trong Events kèm latency">Send</button>
    </form>
  </section>
  <section class="card" style="grid-column:1/-1"><h2>Positions</h2><div class="scroll"><table id="positions"><thead><tr>
    <th title="Position ticket, dùng để close/modify">ticket</th><th>symbol</th><th title="buy hoặc sell">type</th><th title="lot">volume</th><th title="Giá mở">open</th><th title="Stop loss">sl</th><th title="Take profit">tp</th><th title="Lãi/lỗ thả nổi theo tiền tài khoản">profit</th><th title="Magic number">magic</th><th></th></tr></thead><tbody></tbody></table></div></section>
  <section class="card"><h2>Ticks</h2>
    <form id="subs" class="row"><input name="symbols" class="wide" placeholder="EURUSD,GBPUSD" title="Danh sách symbol cách nhau bằng dấu phẩy. Chỉ stream khi có người xem, tự ngắt 30 s sau khi đóng trang"><button>Subscribe</button></form>
    <table id="ticks"><thead><tr><th>symbol</th><th title="Giá bán (sell khớp tại đây)">bid</th><th title="Giá mua (buy khớp tại đây)">ask</th><th title="Giờ tick theo đồng hồ server broker">time</th></tr></thead><tbody></tbody></table>
  </section>
  <section class="card">
    <h2 title="Đo trên các lệnh thật (open/close/modify) của account đang chọn. Không gồm lệnh của account khác.">Tốc độ khớp lệnh</h2>
    <div id="mstat" style="color:var(--muted);margin-bottom:6px"></div>
    <table id="metrics"><thead><tr>
      <th>chặng</th>
      <th title="Trung vị: một nửa số lệnh nhanh hơn con số này. Dùng để biết 'bình thường' là bao nhiêu">thường (p50)</th>
      <th title="95% lệnh nhanh hơn con số này. Dùng để biết 'lúc xấu' là bao nhiêu">xấu (p95)</th>
      <th title="Lệnh chậm nhất trong số đã đo">chậm nhất</th></tr></thead><tbody></tbody></table>
  </section>
  <section class="card"><h2 title="deal: khớp lệnh từ terminal. result: trả lời lệnh kèm ms từng chặng. Mới nhất ở trên">Events</h2><pre id="log"></pre></section>
</div>
<script>
const $ = s => document.querySelector(s);
const key = () => $('#key').value.trim();
const acct = () => $('#acct').value;
const H = () => ({'X-Api-Key': key(), 'Content-Type': 'application/json'});
const log = (t, o) => { const l = $('#log'); l.textContent = `${new Date().toLocaleTimeString()} ${t} ${o === undefined ? '' : JSON.stringify(o)}\n` + l.textContent.slice(0, 20000); };
const fmt = n => n == null ? '' : (+n).toLocaleString(undefined, {maximumFractionDigits: 5});
let abort = null, symbols = '';

try { $('#key').value = localStorage.getItem('apiKey') || ''; symbols = localStorage.getItem('symbols') || ''; $('#subs').symbols.value = symbols; } catch {}
$('#key').addEventListener('change', () => { try { localStorage.setItem('apiKey', key()); } catch {} loadAccounts(); });

async function api(method, path, body) {
  const r = await fetch(path, {method, headers: H(), body: body && JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.detail?.detail || j.detail || r.statusText), {status: r.status, body: j});
  return j;
}

async function loadAccounts() {
  if (!key()) return;
  try {
    const list = await api('GET', '/accounts');
    const cur = acct();
    $('#acct').innerHTML = list.map(a => `<option value="${a.id}">${a.id} ${a.alive ? '●' : '○'}</option>`).join('');
    if (list.some(a => a.id === cur)) $('#acct').value = cur;
    const a = list.find(x => x.id === acct());
    $('#status').innerHTML = a ? ['trader', 'streamer', 'alive'].map(k => `<span class="badge ${a[k] ? 'on' : 'off'}">${k}</span>`).join(' ') : '';
    if (!abort || cur !== acct()) { openStream(); loadMetrics(); loadSymbols(); }  // only (re)open when the account changed; the 15 s poll must not restart the stream
  } catch (e) { log('accounts error', e.message); }
}

function renderState(s) {
  const a = s.account || {};
  $('#account').innerHTML = [['login', a.login], ['server', a.server], ['balance', fmt(a.balance)], ['equity', fmt(a.equity)],
    ['margin', fmt(a.margin)], ['free', fmt(a.margin_free)], ['profit', fmt(a.profit)], ['connected', s.connected]]
    .map(([k, v]) => `<b>${k}</b><span>${v ?? ''}</span>`).join('');
  $('#positions tbody').innerHTML = (s.positions || []).map(p => `<tr>
    <td>${p.ticket}</td><td>${p.symbol}</td><td>${p.type === 0 ? 'buy' : 'sell'}</td><td>${p.volume}</td><td>${fmt(p.price_open)}</td>
    <td>${fmt(p.sl)}</td><td>${fmt(p.tp)}</td><td class="${p.profit >= 0 ? 'pos' : 'neg'}">${fmt(p.profit)}</td><td>${p.magic}</td>
    <td><button data-close="${p.ticket}" class="danger" title="Đóng toàn bộ position (market)">close</button> <button data-modify="${p.ticket}" data-sl="${p.sl}" data-tp="${p.tp}" title="Sửa SL/TP">sl/tp</button></td></tr>`).join('');
  $('#magics').innerHTML = [...new Set((s.positions || []).map(p => p.magic))].map(m => `<option value="${m}">`).join('');
}

const HOPS = [  // key, label, hint (trader view). ms, integer. 'infra' is computed here: total minus broker.
  ['total', 'Tổng từ lúc bấm Send', 'Toàn bộ thời gian từ khi gateway nhận lệnh đến khi có kết quả. Đây là con số bạn cảm nhận.'],
  ['mt5', 'Sàn khớp lệnh', 'Thời gian broker xử lý order_check + order_send. Phần này do sàn và đường truyền VPS → sàn quyết định, hệ thống không rút ngắn được. Muốn giảm: VPS gần server sàn hơn.'],
  ['infra', 'Hạ tầng của mình', 'Tổng trừ phần sàn: gateway, mạng gateway ↔ VPS, hàng đợi trên VPS. Phần này mình kiểm soát được; bình thường vài chục ms.'],
  ['pool', '  ↳ chờ đến lượt trên VPS', 'Lệnh đã tới VPS nhưng phải chờ thread rảnh. Tăng khi bắn nhiều lệnh cùng lúc (4 thread). Trên Windows ~16 ms là độ phân giải timer, bình thường.'],
  ['ack', '  ↳ VPS phản hồi (vòng)', 'Gateway gửi lệnh và nhận xác nhận "đã nhận" từ VPS. Chỉ dùng đồng hồ gateway nên luôn tin được. Lớn = mạng tới VPS chậm hoặc VPS bận.'],
  ['down', '  ↳ mạng tới VPS', 'Một chiều gateway → VPS. Cần đồng hồ VPS đã đồng bộ; nếu trống là chưa đo được.'],
  ['up', '  ↳ kết quả về', 'Một chiều VPS → gateway. Nếu trống là chưa đo được (agent cũ hoặc đồng hồ lệch).'],
];
const agg = vals => { const v = vals.filter(x => x != null).sort((a, b) => a - b); if (!v.length) return null; const q = p => v[Math.min(v.length - 1, Math.round(p * (v.length - 1)))]; return {p50: q(0.5), p95: q(0.95), max: v[v.length - 1]}; };
async function loadMetrics() {
  try {
    const m = await api('GET', `/accounts/${acct()}/metrics`);
    const rec = m.recent || [], ts = rec.map(r => r.at).filter(Boolean);
    const span = ts.length ? ` · từ ${new Date(Math.min(...ts) * 1000).toLocaleString()} đến ${new Date(Math.max(...ts) * 1000).toLocaleTimeString()}` : '';
    $('#mstat').textContent = `Account ${acct()} · ${m.count} lệnh gần nhất${span} · đơn vị ms, làm tròn 1 ms · ô trống = chưa đo được`;
    m.infra = agg(rec.map(r => r.total != null && r.mt5 != null ? r.total - r.mt5 : null));
    const f = v => v == null ? '' : Math.round(v);
    $('#metrics tbody').innerHTML = HOPS.map(([k, label, hint]) => { const v = m[k]; return `<tr><td title="${hint}" style="white-space:pre">${label}</td><td>${v ? f(v.p50) : ''}</td><td>${v ? f(v.p95) : ''}</td><td>${v ? f(v.max) : ''}</td></tr>`; }).join('');
  } catch (e) { log('metrics error', e.message); }
}

async function loadSymbols() {
  const sel = $('#order').symbol, keep = sel.value;
  try {
    const {symbols} = await api('GET', `/accounts/${acct()}/symbols`);
    sel.innerHTML = '<option value="">symbol…</option>' + symbols.map(s => `<option>${s}</option>`).join('');
    sel.value = symbols.includes(keep) ? keep : (symbols.includes('EURUSD') ? 'EURUSD' : '');
  } catch (e) { log('symbols error', e.message); }
}

async function openStream() {
  if (abort) abort.abort();
  abort = new AbortController();
  const id = acct(), signal = abort.signal;
  $('#ticks tbody').innerHTML = '';
  try {
    const r = await fetch(`/accounts/${id}/stream?symbols=${encodeURIComponent(symbols)}`, {headers: H(), signal});
    if (!r.ok) throw new Error(`stream ${r.status}`);
    const reader = r.body.getReader(), dec = new TextDecoder();
    let buf = '', ev = '';
    for (;;) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let i;
      while ((i = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1);
        if (line.startsWith('event:')) ev = line.slice(6).trim();
        else if (line.startsWith('data:')) handle(ev, JSON.parse(line.slice(5)));
      }
    }
    log('stream closed, reconnecting');
  } catch (e) { if (!signal.aborted) log('stream error', e.message); }
  if (!signal.aborted) setTimeout(openStream, 2000);
}

const ticks = {};
function handle(ev, d) {
  if (ev === 'state') renderState(d);
  else if (ev === 'tick') {
    ticks[d.symbol] = d;
    $('#ticks tbody').innerHTML = Object.values(ticks).map(t => `<tr><td>${t.symbol}</td><td>${fmt(t.bid)}</td><td>${fmt(t.ask)}</td><td>${new Date(t.time_msc).toLocaleTimeString()}</td></tr>`).join('');
  } else if (ev === 'deal') log(`deal ${d.entry === 0 ? 'in' : 'out'} ${d.symbol} ${d.volume} @ ${d.price}`, {ticket: d.ticket, magic: d.magic, profit: d.profit});
  else if (ev === 'result') { log(`result ${d.status}`, {retcode: d.retcode, comment: d.comment, order: d.order, ms: d.timing}); loadMetrics(); }
  else if (ev !== 'ack' && ev !== 'heartbeat') log(ev, d);
}

$('#order').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target), body = {};
  for (const [k, v] of f) if (v !== '') body[k] = ['volume', 'sl', 'tp', 'magic'].includes(k) ? +v : v;
  try { log('order ->', body); const r = await api('POST', `/accounts/${acct()}/orders`, body); log(`order ${r.status}`, {retcode: r.retcode, comment: r.comment, order: r.order, price: r.price}); }
  catch (err) { log(`order failed ${err.status}`, err.body); }
});
$('#positions').addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  try {
    if (b.dataset.close) { if (!confirm(`Close position ${b.dataset.close}?`)) return; const r = await api('POST', `/accounts/${acct()}/positions/${b.dataset.close}/close`, {}); log(`close ${r.status}`, {retcode: r.retcode, comment: r.comment}); }
    if (b.dataset.modify) {
      const sl = prompt('SL (empty = unchanged)', b.dataset.sl), tp = prompt('TP (empty = unchanged)', b.dataset.tp);
      if (sl === null && tp === null) return;
      const r = await api('PATCH', `/accounts/${acct()}/positions/${b.dataset.modify}`, {sl: sl ? +sl : null, tp: tp ? +tp : null});
      log(`modify ${r.status}`, {retcode: r.retcode, comment: r.comment});
    }
  } catch (err) { log(`failed ${err.status}`, err.body); }
});
$('#subs').addEventListener('submit', e => { e.preventDefault(); symbols = e.target.symbols.value.replace(/\s/g, ''); try { localStorage.setItem('symbols', symbols); } catch {} openStream(); });
$('#acct').addEventListener('change', () => { openStream(); loadAccounts(); });
$('#refresh').addEventListener('click', loadAccounts);
loadAccounts();
setInterval(() => { if (document.visibilityState === 'visible') loadAccounts(); }, 15000);
</script>
</body>
</html>
